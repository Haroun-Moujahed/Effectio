<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Confirm your Effectio account</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #05070b;
      color: #eef3f8;
      font-family: Outfit, Segoe UI, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    "
  >
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background: #05070b">
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 440px;
              background: #0c1018;
              border: 1px solid rgba(90, 140, 200, 0.18);
              border-radius: 18px;
              overflow: hidden;
            "
          >
            <tr>
              <td
                style="
                  padding: 22px 28px 18px;
                  background: radial-gradient(420px 160px at 50% -40px, rgba(61, 158, 255, 0.18), transparent 70%),
                    #000000;
                  border-bottom: 1px solid rgba(90, 140, 200, 0.14);
                  text-align: center;
                "
              >
                <table role="presentation" cellspacing="0" cellpadding="0" style="margin: 0 auto">
                  <tr>
                    <td style="vertical-align: middle; padding-right: 10px">
                      <img
                        src="https://effectio.space/logo.png"
                        alt=""
                        width="36"
                        height="36"
                        style="display: block; width: 36px; height: 36px; border: 0"
                      />
                    </td>
                    <td
                      style="
                        vertical-align: middle;
                        font-size: 1.35rem;
                        font-weight: 600;
                        letter-spacing: 0.04em;
                        color: #eef3f8;
                      "
                    >
                      Effectio
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 28px 28px 8px; text-align: center">
                <h1
                  style="
                    margin: 0 0 10px;
                    font-size: 1.35rem;
                    font-weight: 600;
                    line-height: 1.3;
                    color: #eef3f8;
                  "
                >
                  Confirm your email
                </h1>
                <p
                  style="
                    margin: 0;
                    font-size: 0.95rem;
                    line-height: 1.5;
                    color: #8a9bb0;
                  "
                >
                  One click to finish signup and start planning your days.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 24px 28px 8px">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    padding: 12px 22px;
                    border-radius: 10px;
                    background: #3d9eff;
                    color: #ffffff;
                    font-size: 0.95rem;
                    font-weight: 600;
                    text-decoration: none;
                    letter-spacing: 0.01em;
                  "
                >
                  Confirm email
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding: 18px 28px 28px; text-align: center">
                <p style="margin: 0; font-size: 0.78rem; line-height: 1.45; color: #6f8298">
                  If you didn’t create an Effectio account, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
